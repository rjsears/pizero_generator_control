<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
<title id="title">Safety Scope warning for RPi Generator Control</title>
<desc id="desc">Warning that the project controls only the dry-contact generator start input and does not replace critical generator or electrical safety systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#050d19"/>
    <stop offset="100%" stop-color="#0b1b30"/>
  </linearGradient>
  <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#122644" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0c1626" stop-opacity="0.6"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="10" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <style>
    .font { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .title { font-size: 56px; font-weight: 800; fill: #ecf2f9; }
    .subtitle { font-size: 31px; fill: #bfccdc; }
    .body { font-size: 34px; fill: #ecf2f9; }
    .bullet { font-size: 33px; fill: #bfccdc; }
    .footer { font-size: 31px; fill: #ecf2f9; }
    .small { font-size: 24px; fill: #82acd6; opacity: 0.85; }
    .badge { font-size: 26px; font-weight: 800; fill: #ffd25a; letter-spacing: 1.6px; }
  </style>
</defs>
<rect width="1800" height="1080" fill="url(#bg)"/>
<circle cx="1460" cy="160" r="430" fill="#2089ff" opacity="0.10"/>
<circle cx="350" cy="900" r="500" fill="#3de678" opacity="0.07"/>
<circle cx="900" cy="520" r="380" fill="#f0b22d" opacity="0.05"/>

<line x1="0" y1="0" x2="0" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="80" y1="0" x2="80" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="160" y1="0" x2="160" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="240" y1="0" x2="240" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="320" y1="0" x2="320" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="400" y1="0" x2="400" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="480" y1="0" x2="480" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="560" y1="0" x2="560" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="640" y1="0" x2="640" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="720" y1="0" x2="720" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="800" y1="0" x2="800" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="880" y1="0" x2="880" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="960" y1="0" x2="960" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="1040" y1="0" x2="1040" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="1120" y1="0" x2="1120" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="1200" y1="0" x2="1200" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="1280" y1="0" x2="1280" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="1360" y1="0" x2="1360" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="1440" y1="0" x2="1440" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="1520" y1="0" x2="1520" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="1600" y1="0" x2="1600" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="1680" y1="0" x2="1680" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="1760" y1="0" x2="1760" y2="1080" stroke="#3776be" stroke-opacity="0.06"/>
<line x1="0" y1="0" x2="1800" y2="0" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="80" x2="1800" y2="80" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="160" x2="1800" y2="160" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="240" x2="1800" y2="240" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="320" x2="1800" y2="320" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="400" x2="1800" y2="400" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="480" x2="1800" y2="480" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="560" x2="1800" y2="560" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="640" x2="1800" y2="640" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="720" x2="1800" y2="720" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="800" x2="1800" y2="800" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="880" x2="1800" y2="880" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="960" x2="1800" y2="960" stroke="#3776be" stroke-opacity="0.05"/>
<line x1="0" y1="1040" x2="1800" y2="1040" stroke="#3776be" stroke-opacity="0.05"/>

<g filter="url(#shadow)">
  <rect x="110" y="110" width="1580" height="860" rx="42" fill="#0c1626" fill-opacity="0.96" stroke="#f0b22d" stroke-width="3"/>
  <path d="M 110 152 Q 110 110 152 110 H 1648 Q 1690 110 1690 152 V 260 H 110 Z" fill="url(#header)" opacity="0.9"/>
  <rect x="130" y="138" width="14" height="804" rx="7" fill="#f0b22d"/>
</g>
<g class="font">
  <polygon points="206,154 166,224 246,224" fill="#ffbe3d" stroke="#ffeaaa" stroke-width="4"/>
  <rect x="201" y="177" width="10" height="28" rx="4" fill="#14171b"/>
  <circle cx="206" cy="218" r="6" fill="#14171b"/>
  <text x="270" y="198" class="title">Safety Scope</text>
  <text x="270" y="242" class="subtitle">Dry-contact generator start only — not a replacement for critical safety systems</text>
  <rect x="1332" y="159" width="314" height="46" rx="23" fill="#5c3c0a" fill-opacity="0.75" stroke="#f0b22d" stroke-width="2"/>
  <text x="1354" y="191" class="badge">READ BEFORE USE</text>

<text x="182" y="332" class="body">This project controls only the dry-contact start input on a generator.</text>
<text x="182" y="380" class="body">It is <tspan font-weight="800" fill="#ffc54c">NOT</tspan> a replacement for, and does not implement:</text>
<circle cx="206" cy="446" r="8" fill="#f0b22d" stroke="#ffe29a" stroke-width="1"/>
<text x="256" y="456" class="bullet">Automatic Transfer Switch (ATS) logic</text>
<circle cx="206" cy="502" r="8" fill="#f0b22d" stroke="#ffe29a" stroke-width="1"/>
<text x="256" y="512" class="bullet">Generator manufacturer safety controls (overspeed, overtemp, low oil, etc.)</text>
<circle cx="206" cy="558" r="8" fill="#f0b22d" stroke="#ffe29a" stroke-width="1"/>
<text x="256" y="568" class="bullet">Overcurrent protection or breaker coordination</text>
<circle cx="206" cy="614" r="8" fill="#f0b22d" stroke="#ffe29a" stroke-width="1"/>
<text x="256" y="624" class="bullet">Carbon monoxide detection or ventilation</text>
<circle cx="206" cy="670" r="8" fill="#f0b22d" stroke="#ffe29a" stroke-width="1"/>
<text x="256" y="680" class="bullet">Fuel storage, fuel-line, or shut-off safety</text>
<circle cx="206" cy="726" r="8" fill="#f0b22d" stroke="#ffe29a" stroke-width="1"/>
<text x="256" y="736" class="bullet">Electrical-code compliance (NEC / CEC / local)</text>

  <line x1="182" y1="791" x2="1612" y2="791" stroke="#53769b" stroke-opacity="0.43" stroke-width="2"/>
  <polygon points="220,826 250,838 244,888 220,906 196,888 190,838" fill="#164874" fill-opacity="0.7" stroke="#49b2ff" stroke-width="2"/>
  <path d="M 206 869 L 217 881 L 237 854" fill="none" stroke="#76ee82" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="276" y="856" class="footer">Electrical work should be performed by a qualified electrician following local code.</text>
  <text x="276" y="902" class="body" font-weight="800" fill="#ffc54c">Use at your own risk.</text>
  <text x="1387" y="945" class="small">RPi Generator Control</text>
</g>
</svg>
